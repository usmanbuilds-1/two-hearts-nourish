name: Test and build
on:
  push:
    branches:
      - "fix/**"
      - "feat/**"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Unit tests
        run: bun run test
      - name: Strict TypeScript typecheck
        run: bun x tsc --noEmit
      - name: Semantic lint
        run: bun x eslint . --rule 'prettier/prettier:off'
      - name: Production build
        run: bun run build

  migration-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Apply schema and verify recovery, RLS, AI quota and stats
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d app_test -v ON_ERROR_STOP=1 -f src/test/sql-migration-fixture.sql
          for migration in 0014_private_meal_photos 0015_device_security 0016_lifetime_couple_stats 0017_ai_quotas; do
            psql -h localhost -U postgres -d app_test -v ON_ERROR_STOP=1 -f "drizzle/migrations/${migration}.sql"
          done
          psql -h localhost -U postgres -d app_test -v ON_ERROR_STOP=1 -f src/test/sql-migration-verify.sql
