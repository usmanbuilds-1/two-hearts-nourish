name: Test and build
on:
  push:
    branches:
      - "fix/**"
      - "feat/**"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Unit tests
        run: bun run test
      - name: Strict TypeScript typecheck
        run: bun x tsc --noEmit
      - name: Semantic lint
        run: bun x eslint . --rule 'prettier/prettier: off'
      - name: Production build
        run: bun run build
